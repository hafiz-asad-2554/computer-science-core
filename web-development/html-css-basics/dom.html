<!DOCTYPE html>
<html>

<body>
    <h1 id="header">Old Header</h1>
    <button onclick="changeText()">Change</button>

    <script>
        function changeText() {
            document.getElementById("header").innerText = "New Header!";
            document.getElementById("header").style.color = "red";
        }
    </script>
</body>

</html>
