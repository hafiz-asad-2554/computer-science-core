<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daa'am-ul-Hayat User Portal</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body class="main-bg min-h-screen flex items-start md:items-center justify-center p-4">
    <!-- Dark Overlay for better text contrast -->
    <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-0"></div> 

    <!-- Root container for the application content -->
    <div id="app-root" class="relative z-10 w-full max-w-4xl pt-8 md:pt-0">
        <!-- Content will be rendered here -->
        <div class="flex justify-center items-center w-full min-h-[50vh]">
            <div id="loading-indicator" class="text-white text-lg flex items-center p-8 bg-black/50 rounded-lg">
                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-[#fcba03]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Initializing Application...
            </div>
        </div>
    </div>

    <!-- Firebase SDK Imports -->
    <script type="module" src="app.js"></script>
</body>
</html>
