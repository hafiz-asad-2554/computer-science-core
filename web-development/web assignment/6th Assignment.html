<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beautiful Web Calculator</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e0c3fc, #8ec5fc);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .calculator {
      background: #fff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      text-align: center;
      width: 340px;
      transition: 0.3s;
    }

    .calculator:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
    }

    h1 {
      margin-bottom: 25px;
      color: #333;
      font-size: 22px;
    }

    input {
      width: 80%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
      transition: 0.3s;
    }

    input:focus {
      border-color: #7f00ff;
      outline: none;
      box-shadow: 0 0 8px rgba(127,0,255,0.3);
    }

    .buttons {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      background: linear-gradient(135deg, #7f00ff, #e100ff);
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      min-width: 120px;
    }

    button:hover {
      background: linear-gradient(135deg, #e100ff, #7f00ff);
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(127,0,255,0.3);
    }

    #result {
      margin-top: 25px;
      font-size: 20px;
      color: #333;
      font-weight: bold;
      background: #f3f3f3;
      padding: 12px;
      border-radius: 10px;
      min-height: 40px;
    }

    .error {
      color: #ff3b3b;
      font-size: 15px;
      margin-top: 10px;
    }

    footer {
      margin-top: 30px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <h1>🧮 Hands-On Task: Build a Calculator</h1>
    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">

    <div class="buttons">
      <button id="addBtn">Add ➕</button>
      <button id="subBtn">Subtract ➖</button>
      <button id="mulBtn">Multiply ✖️</button>
      <button id="divBtn">Divide ➗</button>
    </div>

    <div id="result">Result will appear here</div>
    <div id="errorMsg" class="error"></div>

    <footer>Created by Hafiz Muhammad Asad Mustafa 💡</footer>
  </div>

  <script>
    const num1 = document.getElementById("num1");
    const num2 = document.getElementById("num2");
    const result = document.getElementById("result");
    const errorMsg = document.getElementById("errorMsg");

    // Utility function to validate inputs
    function getNumbers() {
      const val1 = parseFloat(num1.value);
      const val2 = parseFloat(num2.value);

      if (isNaN(val1) || isNaN(val2)) {
        errorMsg.textContent = "⚠️ Please enter valid numbers!";
        result.textContent = "";
        return null;
      }

      errorMsg.textContent = "";
      return [val1, val2];
    }

    // Calculator functions
    function add() {
      const nums = getNumbers();
      if (!nums) return;
      result.textContent = `Result: ${nums[0] + nums[1]}`;
    }

    function subtract() {
      const nums = getNumbers();
      if (!nums) return;
      result.textContent = `Result: ${nums[0] - nums[1]}`;
    }

    function multiply() {
      const nums = getNumbers();
      if (!nums) return;
      result.textContent = `Result: ${nums[0] * nums[1]}`;
    }

    function divide() {
      const nums = getNumbers();
      if (!nums) return;
      if (nums[1] === 0) {
        errorMsg.textContent = "🚫 Cannot divide by zero!";
        result.textContent = "";
        return;
      }
      errorMsg.textContent = "";
      result.textContent = `Result: ${(nums[0] / nums[1]).toFixed(2)}`;
    }

    // Event listeners
    document.getElementById("addBtn").addEventListener("click", add);
    document.getElementById("subBtn").addEventListener("click", subtract);
    document.getElementById("mulBtn").addEventListener("click", multiply);
    document.getElementById("divBtn").addEventListener("click", divide);
  </script>

</body>
</html>
