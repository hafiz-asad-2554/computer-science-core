<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator 6th Assignment</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .calculator {
      background: #ffffff5f;
      border: solid, #0072ff;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      width: 340px;
      padding: 25px;
      text-align: center;
      transition: 0.3s;
    }

    .calculator:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 45px rgba(0,0,0,0.25);
    }

    h2 {
      margin-bottom: 15px;
      color: #333;
      font-size: 20px;
    }

    .display {
      background: #f3f3f3;
      padding: 20px;
      border-radius: 15px;
      font-size: 24px;
      font-weight: bold;
      color: #333;
      text-align: right;
      overflow-x: auto;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-top: 20px;
    }

    button {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 15px 0;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(118,75,162,0.3);
    }

    button:hover {
      background: linear-gradient(135deg, #764ba2, #667eea);
      transform: scale(1.05);
    }

    .operator {
      background: linear-gradient(135deg, #f7971e, #ffd200);
      color: #fff;
    }

    .equal {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      grid-column: span 2;
    }

    .clear {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
    }

    footer {
      margin-top: 25px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <h2>🧮 Calculator</h2>
    <div class="display" id="display">0</div>

    <div class="buttons">
      <!-- Row 1 -->
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">⌫</button>
      <button class="operator" onclick="Operator('%')">%</button>
      <button class="operator" onclick="Operator('/')">÷</button>

      <!-- Row 2 -->
      <button onclick="Number('7')">7</button>
      <button onclick="Number('8')">8</button>
      <button onclick="Number('9')">9</button>
      <button class="operator" onclick="Operator('*')">×</button>

      <!-- Row 3 -->
      <button onclick="Number('4')">4</button>
      <button onclick="Number('5')">5</button>
      <button onclick="Number('6')">6</button>
      <button class="operator" onclick="Operator('-')">−</button>

      <!-- Row 4 -->
      <button onclick="Number('1')">1</button>
      <button onclick="Number('2')">2</button>
      <button onclick="Number('3')">3</button>
      <button class="operator" onclick="Operator('+')">+</button>

      <!-- Row 5 -->
      <button onclick="Number('0')">0</button>
      <button onclick="Number('.')">.</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>

    <footer>Created by Hafiz Muhammad Asad Mustafa 🌟 <hr/> S23NDOCS1M01042 </footer>
  </div>

  <script>
    const display = document.getElementById('display');
    let currentInput = '';

    function Number(num) {
      if (currentInput === '0' && num !== '.') currentInput = '';
      currentInput += num;
      updateDisplay();
    }

    function Operator(op) {
      if (currentInput === '' || /[+\-*/%]$/.test(currentInput)) return;
      currentInput += op;
      updateDisplay();
    }

    function clearDisplay() {
      currentInput = '';
      updateDisplay('0');
    }

    function deleteLast() {
      currentInput = currentInput.slice(0, -1);
      updateDisplay(currentInput || '0');
    }

    function calculate() {
      try {
        if (currentInput === '') return;
        const result = eval(currentInput.replace(/÷/g, '/'));
        currentInput = result.toString();
        updateDisplay();
      } catch (error) {
        updateDisplay('Error');
      }
    }

    function updateDisplay(value) {
      display.textContent = value !== undefined ? value : currentInput;
    }
  </script>
</body>
</html>
